name: Python Bot Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile telemetry_engine.py
          python -m py_compile State_manager.py
          python -m py_compile main_orchestrator.py
          python -m py_compile config.py
          python -m py_compile broker_interface.py
          python -m py_compile risk_manager.py
          python -m py_compile paper_broker.py
          python -m py_compile test_bot.py
          python -m py_compile test_orchestrator.py
          python -m py_compile offline_market_simulator.py
          python -m py_compile offline_ai_decision_test.py
          python -m py_compile offline_end_to_end_test.py
          python -m py_compile test_gemini_api.py

      - name: Run paper trading tests
        run: |
          python -m unittest test_bot.py -v
          python -m unittest test_orchestrator.py -v

      - name: Run offline market simulation
        run: |
          python offline_market_simulator.py

      - name: Run offline AI decision test
        run: |
          python offline_ai_decision_test.py

      - name: Run offline end-to-end test
        run: |
          python offline_end_to_end_test.py

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python test_gemini_api.py

      - name: Test completed
        run: |
          echo "======================================"
          echo "AI TRADING BOT TESTS PASSED"
          echo "PAPER TRADING ONLY"
          echo "NO REAL ORDERS SENT"
          echo "======================================"
