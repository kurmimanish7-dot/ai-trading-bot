name: Python Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile telemetry_engine.py
          python -m py_compile state_manager.py
          python -m py_compile main_orchestrator.py
          python -m py_compile config.py
          python -m py_compile broker_interface.py
          python -m py_compile risk_manager.py
          python -m py_compile paper_broker.py

      - name: Test completed
        run: echo "Paper trading bot code syntax check completed."
